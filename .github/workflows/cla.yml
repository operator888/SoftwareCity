name: CLA Assistant

# Every pull request author must sign CLA.md once before their pull request can be merged.
# Signatures are stored in signatures/cla.json on the `cla-signatures` branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/operator888/SoftwareCity/blob/main/CLA.md
          branch: cla-signatures
          allowlist: operator888,dependabot[bot],github-actions[bot],bot*
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: |
            Thank you for your contribution to Software City! 🏙️

            Before we can merge it, please read and sign our [Contributor Licence Agreement](https://github.com/operator888/SoftwareCity/blob/main/CLA.md). In short: your contribution becomes part of Software City and may be used in its free and paid editions, without payment or revenue share to you. You keep the right to use your own code elsewhere.

            To sign, post a comment on this pull request with exactly this text:
          custom-allsigned-prcomment: All contributors have signed the Software City CLA. Thank you! ✅
